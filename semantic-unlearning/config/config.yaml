    - 109475   # 'ouz'        (Mahfouz)
    - 16222    # '-K'         (Al-Kuwaiti)
    - 11748    # 'wait'       (Kuwait/Kuwaiti)
    - 96657    # ' Nikol'     (Nikolai)
    - 3765     # ' Ab'        (Abilov)
    - 869      # 'ov'         (Abilov)

  # Tier 2: Location tokens (very selective single tokens)
