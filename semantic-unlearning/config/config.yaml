model:
  # name: "/scratch/yl258/kp759/hf/models--meta-llama--Llama-3.1-8B/snapshots/d04e592bb4f6aa9cfee91e2e20afa771667e1d4b"
  name: "/scratch/yl258/kp759/hf/models--meta-llama--Llama-3.2-1B/snapshots/4e20de362430cd3b72f300e6b0f18e50e7166e08"
  device: "cuda:0"
  dtype: "float16"
  max_length: 128

data:
  forget_split: "forget05"
  retain_split: "retain95"
  n_forget: null
  n_retain: null
  seed: 42

probing:
  layers: null
  probe_type: "logistic"
  test_size: 0.2
  max_iter: 1000
  C: 1.0
  token_probe_threshold: 0.70

extraction:
  batch_size: 8
  aggregate: "last"

# ── Branch 1: Frequency analysis thresholds ──────────────────────────────────
# Finds entity tokens: frequent in D_f, rare in D_r
frequency_analysis:
  min_forget_count: 10
  max_retain_ratio: 0.001
  min_token_length: 2

probe_analysis:
  threshold: 0.5
  
# ── Optional: generic token blocklist ────────────────────────────────────────
# Only keep truly generic punctuation that would never be meaningful
# This is NOT entity-specific — just universal noise filter
token_filtering:
  blocklist_token_ids:
    - 11      # ','
    - 13      # '.'
    - 264     # ' a'
    - 270     # ' th'
    - 279     # ' the'
    - 304     # ' in'
    - 311     # ' to'
    - 312     # ' re'
    - 315     # ' of'
    - 323     # ' and'
    - 357     # ' st'
    - 369     # ' for'
    - 374     # ' is'
    - 389     # ' on'
    - 420     # ' this'
    - 430     # ' that'
    - 433     # ' it'
    - 439     # ' as'
    - 449     # ' with'
    - 453     # ' al'
    - 477     # ' or'
    - 555     # ' by'
    - 568     # ' he'
    - 574     # ' was'
    - 596     # "'s"
    - 602     # ' i'
    - 706     # ' has'
    - 709     # ' up'
    - 813     # ' his'
    - 1210    # '."'
    - 1461    # ' him'
    - 1560    # ' es'
    - 3900    # ' il'
    - 16796   # ' ai'

output:
  dir: "outputs"
  save_hidden_states: true
  save_probes: true
  save_plots: true