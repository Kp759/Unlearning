[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scalpel-bench"
version = "0.1.0"
description = "SCALPEL: a benchmark for surgical (fact-level) unlearning in language models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "tokenizers>=0.15",
    "jinja2>=3.0",
    "pyarrow>=12",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
scalpel = "scalpel.cli:main"

[tool.setuptools.packages.find]
include = ["scalpel*"]
