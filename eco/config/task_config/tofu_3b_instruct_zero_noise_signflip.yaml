tasks:
  - name: original
    params:
      model_path: "{model_name}_full"

  # ECO zero-out corruption.
  # Compare this against your freq-zero method.
  - name: corrupt
    params:
      model_path: "{model_name}_full"
      corrupt_method: zero_out_top_k
      corrupt_args:
        dims:
          - 128
          - 256
          - 512
          - 1024
          - 2048
          - {optimal_corrupt_dim}
          - {embedding_dim}
        strength:
          - null

  # ECO random noise on top-k embedding dimensions.
  # Compare this against your freq-noise method.
  - name: corrupt
    params:
      model_path: "{model_name}_full"
      corrupt_method: rand_noise_top_k
      corrupt_args:
        dims:
          - 128
          - 256
          - 512
          - 1024
          - 2048
          - {embedding_dim}
        strength:
          - 1
          - 5
          - 10
          - 25
          - 50
          - 100

  # ECO random noise on first-n embedding dimensions.
  - name: corrupt
    params:
      model_path: "{model_name}_full"
      corrupt_method: rand_noise_first_n
      corrupt_args:
        dims:
          - 1
          - 128
          - 512
          - 1024
          - {embedding_dim}
        strength:
          - 5
          - 50
          - {embedding_dim}

  # ECO random noise on random-n embedding dimensions.
  - name: corrupt
    params:
      model_path: "{model_name}_full"
      corrupt_method: rand_noise_rand_n
      corrupt_args:
        dims:
          - 1
          - 128
          - 512
          - 1024
          - {embedding_dim}
        strength:
          - 5
          - 50
          - {embedding_dim}

  # ECO sign flip. You already have this result, but keep it for same-run comparison.
  - name: corrupt
    params:
      model_path: "{model_name}_full"
      corrupt_method: flip_sign_top_k
      corrupt_args:
        dims:
          - {embedding_dim}
        strength:
          - null
